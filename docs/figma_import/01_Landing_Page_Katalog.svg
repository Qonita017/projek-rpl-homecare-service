        <text x="155" y="236" font-size="12" font-weight="600" fill="#1E40AF" text-anchor="middle">Diagnosa Masalah Kulkas →</text>
      </g>

      <g id="Card_MesinCuci" transform="translate(670, 80)">
        <rect width="310" height="260" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-sm)" />
        <rect x="20" y="20" width="56" height="56" rx="12" fill="#EFF6FF" />
        <text x="48" y="55" font-size="24" text-anchor="middle">🧺</text>
        <text x="20" y="110" font-size="18" font-weight="700" fill="#1E293B">Mesin Cuci</text>
        <text x="20" y="135" font-size="13" font-weight="400" fill="#64748B">Front Loading, Top Loading 1 &amp; 2 Tabung</text>
        <text x="20" y="175" font-size="12" font-weight="600" fill="#64748B">Kisaran Biaya Servis:</text>
        <text x="20" y="200" font-size="16" font-weight="700" fill="#1565C0">Rp 90.000 - Rp 220.000</text>
        <rect x="20" y="215" width="270" height="32" rx="6" fill="#F1F5F9" />
        <text x="155" y="236" font-size="12" font-weight="600" fill="#1E40AF" text-anchor="middle">Diagnosa Mesin Cuci →</text>
      </g>

      <g id="Card_Kompor" transform="translate(1005, 80)">
        <rect width="310" height="260" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-sm)" />
        <rect x="20" y="20" width="56" height="56" rx="12" fill="#EFF6FF" />
        <text x="48" y="55" font-size="24" text-anchor="middle">🔥</text>
        <text x="20" y="110" font-size="18" font-weight="700" fill="#1E293B">Kompor Listrik / Gas</text>
        <text x="20" y="135" font-size="13" font-weight="400" fill="#64748B">Rinnai, Quantum, Modena, Philips</text>
        <text x="20" y="175" font-size="12" font-weight="600" fill="#64748B">Kisaran Biaya Servis:</text>
        <text x="20" y="200" font-size="16" font-weight="700" fill="#1565C0">Rp 60.000 - Rp 150.000</text>
        <rect x="20" y="215" width="270" height="32" rx="6" fill="#F1F5F9" />
        <text x="155" y="236" font-size="12" font-weight="600" fill="#1E40AF" text-anchor="middle">Diagnosa Kompor →</text>
      </g>
