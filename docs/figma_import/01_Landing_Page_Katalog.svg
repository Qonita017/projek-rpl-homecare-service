        <text x="20" y="175" font-size="12" font-weight="600" fill="#64748B">Kisaran Biaya Servis:</text>
        <text x="20" y="200" font-size="16" font-weight="700" fill="#1565C0">Rp 75.000 - Rp 250.000</text>
        <rect x="20" y="215" width="270" height="32" rx="6" fill="#F1F5F9" />
        <text x="155" y="236" font-size="12" font-weight="600" fill="#1E40AF" text-anchor="middle">Diagnosa Masalah AC →</text>
      </g>

      <g id="Card_Kulkas" transform="translate(335, 80)">
        <rect width="310" height="260" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-sm)" />
        <rect x="20" y="20" width="56" height="56" rx="12" fill="#EFF6FF" />
        <text x="48" y="55" font-size="24" text-anchor="middle">🧊</text>
        <text x="20" y="110" font-size="18" font-weight="700" fill="#1E293B">Lemari Es (Kulkas)</text>
        <text x="20" y="135" font-size="13" font-weight="400" fill="#64748B">Sharp, Polytron, LG, Aqua, Toshiba</text>
