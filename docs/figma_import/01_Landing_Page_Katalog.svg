    <!-- FOOTER -->
    <g id="Footer" transform="translate(0, 880)">
      <rect width="1440" height="80" fill="#0F172A" />
      <text x="60" y="45" font-size="13" fill="#94A3B8">© 2026 HomeCare Service. Rekayasa Perangkat Lunak - Qonita Goniyun Ulum (STMIK IKMI Cirebon)</text>
      <text x="1380" y="45" font-size="13" fill="#60A5FA" text-anchor="end">PHP Native MVC • MySQL • Bootstrap 5</text>
    </g>
    
</svg>