      <text x="0" y="55" font-size="14" font-weight="400" fill="#64748B">Estimasi tarif perbaikan transparan berdasarkan data pasar resmi</text>
      
      <!-- GRID CARDS (4 CARDS) -->
      <g id="Card_AC" transform="translate(0, 80)">
