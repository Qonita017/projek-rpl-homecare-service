<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="960" viewBox="0 0 1440 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.05" />
    </filter>
    <filter id="shadow-md" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="1440" height="960" fill="#F8FAFC" />
  
    
    <!-- NAVBAR GLOBAL -->
    <g id="Navbar_Global">
      <rect width="1440" height="72" fill="#1565C0" />
      <g id="Brand_Logo" transform="translate(60, 20)">
        <rect width="32" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.2" />
        <path d="M16 8L8 15V24H13V19H19V24H24V15L16 8Z" fill="#FFFFFF" />
        <text x="42" y="22" font-size="18" font-weight="700" fill="#FFFFFF">HomeCare Service</text>
        <text x="195" y="21" font-size="12" font-weight="600" fill="#93C5FD"></text>
      </g>
      <g id="Nav_Links" transform="translate(480, 26)">
        <text x="0" y="16" font-size="14" font-weight="600" fill="#FFFFFF">Beranda</text>
        <text x="90" y="16" font-size="14" font-weight="600" fill="#BFDBFE">AI Diagnosis</text>
        <text x="210" y="16" font-size="14" font-weight="600" fill="#BFDBFE">Pesanan Saya</text>
        <text x="340" y="16" font-size="14" font-weight="600" fill="#BFDBFE">AI Assistant</text>
        <text x="460" y="16" font-size="14" font-weight="600" fill="#BFDBFE">Pembayaran</text>
      </g>
      <g id="User_Profile" transform="translate(1180, 18)">
        <rect width="90" height="36" rx="18" fill="#F59E0B" />
        <text x="45" y="22" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">CUSTOMER</text>
        <rect x="100" width="100" height="36" rx="18" fill="#EF4444" />
        <text x="150" y="22" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Keluar</text>
      </g>
    </g>
    
    
    <!-- HERO SECTION -->
    <g id="Hero_Section" transform="translate(60, 110)">
      <rect width="1320" height="340" rx="16" fill="#1E40AF" />
      <g id="Hero_Text" transform="translate(60, 50)">
        <rect width="180" height="28" rx="14" fill="#3B82F6" />
        <text x="90" y="19" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">✨ Solusi Servis Cerdas Berbasis AI</text>
        <text x="0" y="80" font-size="34" font-weight="700" fill="#FFFFFF">Perbaikan &amp; Perawatan Peralatan</text>
        <text x="0" y="125" font-size="34" font-weight="700" fill="#93C5FD">Rumah Tangga Cepat, Tepat &amp; Terpercaya</text>
        <text x="0" y="170" font-size="15" font-weight="400" fill="#DBEAFE">Konsultasikan keluhan kerusakan alat elektronik Anda dengan AI Smart Diagnosis.</text>
        <text x="0" y="195" font-size="15" font-weight="400" fill="#DBEAFE">Dapatkan estimasi biaya wajar dan teknisi berpengalaman langsung ke rumah Anda.</text>
        
        <!-- CTA BUTTONS -->
        <g id="CTA_Buttons" transform="translate(0, 225)">
          <rect width="210" height="48" rx="8" fill="#F59E0B" />
          <text x="105" y="30" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">⚡ Konsultasi AI Diagnosis</text>
          
          <rect x="230" width="180" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="1.5" />
          <text x="320" y="30" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">📅 Pesan Servis Sekarang</text>
        </g>
      </g>
    </g>

