<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="960" viewBox="0 0 1440 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.05" />
    </filter>
    <filter id="shadow-md" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="1440" height="960" fill="#F8FAFC" />
  
    
    <!-- NAVBAR GLOBAL -->
    <g id="Navbar_Global">
      <rect width="1440" height="72" fill="#1565C0" />
      <g id="Brand_Logo" transform="translate(60, 20)">
        <rect width="32" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.2" />
        <path d="M16 8L8 15V24H13V19H19V24H24V15L16 8Z" fill="#FFFFFF" />
        <text x="42" y="22" font-size="18" font-weight="700" fill="#FFFFFF">HomeCare Service</text>
        <text x="195" y="21" font-size="12" font-weight="600" fill="#93C5FD">— AI Smart Diagnosis</text>
      </g>
      <g id="Nav_Links" transform="translate(480, 26)">
        <text x="0" y="16" font-size="14" font-weight="600" fill="#BFDBFE">Beranda</text>
        <text x="90" y="16" font-size="14" font-weight="600" fill="#FFFFFF">AI Diagnosis</text>
        <text x="210" y="16" font-size="14" font-weight="600" fill="#BFDBFE">Pesanan Saya</text>
        <text x="340" y="16" font-size="14" font-weight="600" fill="#BFDBFE">AI Assistant</text>
        <text x="460" y="16" font-size="14" font-weight="600" fill="#BFDBFE">Pembayaran</text>
      </g>
      <g id="User_Profile" transform="translate(1180, 18)">
        <rect width="90" height="36" rx="18" fill="#F59E0B" />
        <text x="45" y="22" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">CUSTOMER</text>
        <rect x="100" width="100" height="36" rx="18" fill="#EF4444" />
        <text x="150" y="22" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Keluar</text>
      </g>
    </g>
    
    
    <g id="Content_AI_Diagnosis" transform="translate(60, 100)">
      <!-- HEADER -->
      <text x="0" y="26" font-size="24" font-weight="700" fill="#1E293B">AI Assistant Diagnosis Kerusakan Peralatan</text>
      <text x="0" y="52" font-size="14" font-weight="400" fill="#64748B">Gunakan model kecerdasan buatan untuk mengidentifikasi penyebab kerusakan dan estimasi biaya perbaikan</text>

      <!-- LEFT COLUMN: INPUT FORM -->
      <g id="Diagnosis_Form_Card" transform="translate(0, 75)">
        <rect width="480" height="680" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-sm)" />
        <g transform="translate(24, 24)">
          <text x="0" y="20" font-size="16" font-weight="700" fill="#1E293B">Formulir Gejala Kerusakan</text>
          
          <text x="0" y="60" font-size="13" font-weight="600" fill="#334155">Pilih Peralatan Rumah Tangga:</text>
          <rect y="72" width="432" height="44" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
          <text x="14" y="99" font-size="14" fill="#0F172A">Kulkas / Lemari Es (Sharp - 2 Pintu)</text>
          
          <text x="0" y="145" font-size="13" font-weight="600" fill="#334155">Keluhan Utama Kerusakan:</text>
          <rect y="157" width="432" height="44" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
          <text x="14" y="184" font-size="14" fill="#0F172A">Kulkas Kurang Dingin, Freezer Berbunga Es Tebal</text>
          
          <text x="0" y="230" font-size="13" font-weight="600" fill="#334155">Gejala Tambahan / Suara Abnormal (Opsional):</text>
          <rect y="242" width="432" height="80" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
          <text x="14" y="270" font-size="13" fill="#0F172A">Bunyi klik berulang dari kompresor bagian belakang,</text>
          <text x="14" y="292" font-size="13" fill="#0F172A">bagian bawah sama sekali tidak dingin.</text>
          
          <text x="0" y="350" font-size="12" font-weight="600" fill="#64748B">Contoh Keluhan Cepat:</text>
          <g transform="translate(0, 362)">
            <rect width="130" height="30" rx="15" fill="#EFF6FF" stroke="#BFDBFE" />
            <text x="65" y="20" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">AC Tidak Dingin</text>
            
            <rect x="140" width="135" height="30" rx="15" fill="#EFF6FF" stroke="#BFDBFE" />
            <text x="207" y="20" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">Mesin Cuci Macet</text>
            
            <rect x="285" width="140" height="30" rx="15" fill="#EFF6FF" stroke="#BFDBFE" />
            <text x="355" y="20" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">Kulkas Bunyi Klik</text>
          </g>

          <!-- SUBMIT BUTTON -->
          <rect y="420" width="432" height="50" rx="8" fill="#1565C0" />
          <text x="216" y="451" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">⚡ Analisis Kerusakan dengan AI</text>
          
          <rect y="490" width="432" height="90" rx="8" fill="#F1F5F9" />
          <text x="14" y="515" font-size="12" font-weight="600" fill="#475569">💡 Informasi Engine AI Aktif:</text>
          <text x="14" y="538" font-size="11" fill="#64748B">• Provider: Google Gemini API (gemini-2.5-flash)</text>
          <text x="14" y="556" font-size="11" fill="#64748B">• Fallback: Smart Heuristic Rule Engine (Aktif Otomatis)</text>
        </g>
      </g>

      <!-- RIGHT COLUMN: 5 DIAGNOSIS RESULT CARDS (From user screenshot) -->
      <g id="Diagnosis_Results_Cards" transform="translate(510, 75)">
        <!-- Card 1: Analisis Kerusakan -->
        <g id="Card_1" transform="translate(0, 0)">
          <rect width="810" height="110" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
          <text x="20" y="30" font-size="14" font-weight="700" fill="#1E40AF">1. Analisis Kerusakan &amp; Gejala Utama</text>
          <text x="20" y="58" font-size="12.5" fill="#1E293B">Terjadi kegagalan pada sistem defrost otomatis (pencair es) atau overload kompresor.</text>
          <text x="20" y="80" font-size="12.5" fill="#1E293B">Sirkulasi udara dingin dari freezer ke ruang pendingin bawah terhalang oleh tumpukan es tebal.</text>
        </g>

        <!-- Card 2: Penyebab -->
        <g id="Card_2" transform="translate(0, 125)">
          <rect width="810" height="110" rx="10" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
          <text x="20" y="30" font-size="14" font-weight="700" fill="#B45309">2. Kemungkinan Penyebab &amp; Komponen Terkait</text>
          <text x="20" y="58" font-size="12.5" fill="#1E293B">Penyebab utama meliputi: sensor bimetal defrost rusak, timer defrost macet, heater pemanas putus,</text>
          <text x="20" y="80" font-size="12.5" fill="#1E293B">atau relay start kompresor aus sehingga overload protector memutus aliran listrik secara periodik.</text>
        </g>

        <!-- Card 3: Panduan Penanganan Mandiri -->
        <g id="Card_3" transform="translate(0, 250)">
          <rect width="810" height="110" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
          <text x="20" y="30" font-size="14" font-weight="700" fill="#047857">3. Panduan Penanganan Awal yang Aman di Rumah</text>
          <text x="20" y="58" font-size="12.5" fill="#1E293B">Matikan kulkas dan cabut kabel power selama 6-8 jam untuk mencairkan akumulasi bunga es secara alami.</text>
          <text x="20" y="80" font-size="12.5" fill="#1E293B">Hindari mencongkel es dengan pisau/benda tajam karena berisiko menusuk pipa evaporator freon.</text>
        </g>

        <!-- Card 4: Saran Teknisi -->
        <g id="Card_4" transform="translate(0, 375)">
          <rect width="810" height="110" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
          <text x="20" y="30" font-size="14" font-weight="700" fill="#6D28D9">4. Saran &amp; Rekomendasi Pemeriksaan Teknisi</text>
          <text x="20" y="58" font-size="12.5" fill="#1E293B">Pemeriksaan fisik langsung oleh teknisi diperlukan untuk menguji kontinuitas bimetal defrost,</text>
          <text x="20" y="80" font-size="12.5" fill="#1E293B">mengukur arus starting relay kompresor, dan memeriksa tekanan sirkulasi gas freon.</text>
        </g>

        <!-- Card 5: Estimasi Biaya -->
        <g id="Card_5" transform="translate(0, 500)">
          <rect width="810" height="95" rx="10" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5" />
          <text x="20" y="32" font-size="15" font-weight="700" fill="#15803D">💰 5. Estimasi Perkiraan Biaya Wajar</text>
          <text x="20" y="62" font-size="18" font-weight="800" fill="#166534">Rp 120.000 — Rp 250.000</text>
          <text x="240" y="62" font-size="12" fill="#15803D">(Estimasi komponen bimetal / starting relay + jasa pengerjaan teknisi)</text>
        </g>

        <!-- ACTION BUTTON TO ORDER -->
        <g id="CTA_To_Order" transform="translate(0, 615)">
          <rect width="810" height="52" rx="8" fill="#10B981" />
          <text x="405" y="32" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">📅 Pesan Teknisi dengan Hasil Diagnosa Ini →</text>
        </g>
      </g>
    </g>
    
</svg>